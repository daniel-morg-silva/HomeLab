apiVersion: batch/v1
kind: Job
metadata:
  name: db-init
  namespace: whoop
spec:
  template:
    spec:
      containers:
      - name: init-db
        image: ghcr.io/mischavandenburg/whoop-scraper:v0.0.5
        command: ["/app/.venv/bin/whoop-scraper"]
        args: ["init-db"]
        env:
        - name: WHOOP_DB_HOST
          valueFrom:
            configMapKeyRef:
              name: whoop-config
              key: WHOOP_DB_HOST
        - name: WHOOP_DB_PORT
          valueFrom:
            configMapKeyRef:
              name: whoop-config
              key: WHOOP_DB_PORT
        - name: WHOOP_DB_NAME
          valueFrom:
            configMapKeyRef:
              name: whoop-config
              key: WHOOP_DB_NAME
        - name: WHOOP_DB_USER
          valueFrom:
            configMapKeyRef:
              name: whoop-config
              key: WHOOP_DB_USER
        - name: WHOOP_DB_PASSWORD
          valueFrom:
            secretKeyRef:
              name: whoop-cluster-app
              key: password
      restartPolicy: Never
  backoffLimit: 3
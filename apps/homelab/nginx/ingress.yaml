apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nginx-ingress
  namespace: nginx
  annotations:
    nginx.org/mergeable-ingress-type: "minion"
    nginx.org/redirect-to-https: "true"

spec:
  ingressClassName: nginx
  
  rules:
  - host: danielmorgsilva.dev
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: nginx-service
            port:
              number: 80
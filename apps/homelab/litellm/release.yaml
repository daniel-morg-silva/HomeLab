apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: litellm
  namespace: litellm
spec:
  interval: 1h
  chart:
    spec:
      chart: litellm-helm
      version: 1.100.1
      sourceRef:
        kind: HelmRepository
        name: litellm
        namespace: litellm
      interval: 24h

  values:
    masterkeySecretName: litellm-secrets
    masterkeySecretKey: PROXY_MASTER_KEY
    
    environmentSecrets:
      - litellm-secrets

    proxy_config:
      general_settings:
        callbacks: ["prometheus"]
      model_list:
        - model_name: gemini-flash
          litellm_params:
            model: gemini/gemini-3.6-flash
            api_key: os.environ/GEMINI_API_KEY

    db:
      useExisting: true
      endpoint: litellm-db-rw
      database: litellm
      secret:
        name: litellm-db-app
        usernameKey: username
        passwordKey: password

    migrationJob:
      enabled: true

    service:
      type: ClusterIP
      port: 4000

    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        memory: 1Gi

    affinity:
      nodeAffinity:
        preferredDuringSchedulingIgnoredDuringExecution:
          - weight: 100
            preference:
              matchExpressions:
                - key: node-role.kubernetes.io/control-plane
                  operator: DoesNotExist
    serviceMonitor:
      enabled: false
      interval: 30s
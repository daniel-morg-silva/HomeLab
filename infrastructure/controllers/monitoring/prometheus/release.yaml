apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: prometheus
  namespace: monitoring
spec:
  chart:
    spec:
      chart: kube-prometheus-stack
      version: 83.4.x
      sourceRef:
        kind: HelmRepository
        name: prometheus
      interval: 24h # interval for checking a new chart
  interval: 1h # interval for checking drifting
  targetNamespace: monitoring
  releaseName: prometheus
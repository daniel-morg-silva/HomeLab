apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: cnpg
  namespace: cnpg-system
spec:
  chart:
    spec:
      chart: cloudnative-pg
      version: 0.27.x
      sourceRef:
        kind: HelmRepository
        name: cnpg
      interval: 24h # interval for checking a new chart
  interval: 1h # interval for checking drifting
  targetNamespace: cnpg-system
  releaseName: cloudnative-pg
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: master-ingress
  namespace: default
  annotations:
    nginx.org/mergeable-ingress-type: "master"
spec:
  ingressClassName: nginx

  tls:
  - hosts:
      - danielmorgsilva.dev
    secretName: danielmorgsilva-dev-secret
    
  rules:
  - host: danielmorgsilva.net
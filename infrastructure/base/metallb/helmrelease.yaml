apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: metallb
  namespace: metallb-system
spec:
  chart:
    spec:
      chart: metallb
      version: 0.15.x
      sourceRef:
        kind: HelmRepository
        name: metallb
      interval: 24h # interval for checking a new chart
  interval: 1h # interval for checking drifting
  targetNamespace: metallb-system
  releaseName: metallb
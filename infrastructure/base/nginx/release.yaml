#
#     FLux helm release CRD for installing nginx. ingress controller helm chart
#

apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: nginx-ingress
  namespace: nginx-ingress
spec:
  chart:
    spec:
      chart: nginx-ingress
      version: 5.3.x
      interval: 24h # interval for checking a new chart
      sourceRef:
        kind: HelmRepository
        name: nginx-ingress
  interval: 1h # interval for checking drifting
  releaseName: nginx-ingress
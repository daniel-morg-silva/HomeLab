apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: apps
  namespace: flux-system
spec:
  interval: 10m0s
  path: ./apps/homelab
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
      provider: sops
      secretRef:
        name: sops-age

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: grafana-ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 10m0s
  path: ./apps/homelab/grafana
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
      provider: sops
      secretRef:
        name: sops-age

---

apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: alertmanager-ingress
  namespace: flux-system
spec:
  dependsOn:
    - name: monitoring-controllers
  interval: 10m0s
  path: ./apps/homelab/alertmanager
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  decryption:
      provider: sops
      secretRef:
        name: sops-age